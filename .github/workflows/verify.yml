name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-builder-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout candidate in normal read-only CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install the schema test validator without lifecycle scripts
        run: npm ci --prefix scripts/test/schema-validator --ignore-scripts --no-audit --no-fund

      - name: Verify trusted intake and canonical skill
        run: |
          node --test --test-concurrency=1 scripts/test/verify-public-hook-application*.test.mjs
          node --test skills/programmable-v4-hook-builder/scripts/test/*.test.mjs
          node skills/programmable-v4-hook-builder/scripts/verify-skill.mjs
          node skills/programmable-v4-hook-builder/scripts/verify-skill.mjs --installed

      - name: Check generated plugin bytes and packaging
        run: |
          node plugins/marketplace/scripts/generate-plugin.mjs --check
          node --test plugins/marketplace/test/plugin-packaging.test.mjs

      - name: Validate eval structure without a model provider
        run: |
          node scripts/evals/validate-evals.mjs
          node --test evals/tests/*.test.mjs

  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Bootstrap pinned dependencies
        run: ./scripts/bootstrap-deps.sh

      - name: Verify model registry
        run: node scripts/verify-model-registry.mjs

      - name: Verify release evidence
        run: node scripts/verify-release-evidence.mjs

      - name: Check documentation links
        run: |
          node --test scripts/test/check-documentation-links.test.mjs
          node scripts/check-documentation-links.mjs

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --no-match-contract ClassicV3MainnetForkTest

      - name: Check gas snapshot
        run: >-
          forge snapshot
          --no-match-contract ClassicV3MainnetForkTest
          --fuzz-seed 0x70726f6772616d6d61626c65
          --check .gas-snapshot
