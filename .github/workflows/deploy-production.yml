name: Stage Production Candidate

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      custom_launch_stage_mode:
        description: Custom Launch evidence scope for this stage
        required: true
        default: none
        type: choice
        options:
          - none
          - dark
          - enabled
      custom_launch_public_enablement:
        description: Exact public flag requested from the pulled production configuration
        required: true
        default: false
        type: boolean
      custom_launch_release_record_commit_sha:
        description: Exact commit on command-center-release-records containing the detached record
        required: false
        default: ""
        type: string
      custom_launch_release_record_sha256:
        description: Canonical detached record SHA-256 printed by the verifier
        required: false
        default: ""
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: programmable-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify exact production commit
    if: >-
      github.repository == '0xprogrammable/programmable' &&
      github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      verified_sha: ${{ steps.exact-head.outputs.sha }}

    steps:
      - name: Check out exact production commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan exact production change history
        env:
          PROGRAMMABLE_GITLEAKS_BASE_SHA: ${{ github.event.before }}
        run: bash scripts/security/run-gitleaks-ci.sh

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: |
          npm ci
          pipx install slither-analyzer==0.11.5

      - name: Pin pnpm
        run: |
          npm install --global pnpm@10.32.0
          test "$(pnpm --version)" = "10.32.0"

      - name: Verify indexer
        run: |
          pnpm --dir indexer install --frozen-lockfile
          pnpm --dir indexer audit --prod --audit-level high
          pnpm --dir indexer codegen
          pnpm --dir indexer typecheck
          pnpm --dir indexer test

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify operations source contract
        run: npm run perf:read-model:ops-gate

      - name: Verify interface and release gates
        run: npm run verify

      - name: Verify fresh database migrations
        run: npm run db:test:pglite

      - name: Verify contracts
        run: |
          npm run contracts:verify:ci
          npm run contracts:official-deployments
          npm run contracts:slither

      - name: Bind verified evidence to exact commit
        id: exact-head
        run: |
          verified_sha="$(git rev-parse HEAD)"
          test "$verified_sha" = "$GITHUB_SHA"
          echo "sha=$verified_sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: Stage programmable.market candidate
    needs: release-gate
    if: >-
      github.repository == '0xprogrammable/programmable' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      needs.release-gate.outputs.verified_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out production
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-gate.outputs.verified_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@54.1.0

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Resolve Custom Launch release-record policy
        id: custom-launch-policy
        env:
          CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED: ${{ inputs.custom_launch_public_enablement || false }}
          CUSTOM_LAUNCH_PRODUCTION_MODE: ${{ vars.CUSTOM_LAUNCH_PRODUCTION_MODE }}
          CUSTOM_LAUNCH_STAGE_MODE: ${{ inputs.custom_launch_stage_mode || 'none' }}
        run: >-
          node scripts/resolve-custom-launch-staging-policy.mjs
          --env-file .vercel/.env.production.local
          --requested "$CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED"
          --production-mode "$CUSTOM_LAUNCH_PRODUCTION_MODE"
          --stage-mode "$CUSTOM_LAUNCH_STAGE_MODE"
          --github-output "$GITHUB_OUTPUT"

      - name: Capture sensitive production environment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          umask 077
          vercel env ls production --format json --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-production-env-metadata.json"

      - name: Capture current production rollback target
        id: production-before
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm run perf:read-model:production-binding --
          --target-url "https://programmable.market"
          --reject-git-head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify detached Custom Launch release record
        id: custom-launch-record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
          EXPECTED_RECORD_SHA256: ${{ inputs.custom_launch_release_record_sha256 }}
          EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA }}
          EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256 }}
          EXPECTED_SESSION_AUTHORITY_CONFIGURATION_EVIDENCE_SHA256: ${{ vars.PROGRAMMABLE_GITHUB_SESSION_AUTHORITY_CONFIGURATION_EVIDENCE_SHA256 }}
          PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN: ${{ secrets.PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN }}
          COMMAND_CENTER_GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          ROLLBACK_DEPLOYMENT_URL: ${{ steps.production-before.outputs.deployment_url }}
          ROLLBACK_WEBSITE_COMMIT_SHA: ${{ steps.production-before.outputs.git_head }}
          RECORD_REQUIREMENT: ${{ steps.custom-launch-policy.outputs.release_record_requirement }}
          REQUIRED_DEPLOYMENT_STATE: ${{ steps.custom-launch-policy.outputs.required_deployment_state }}
        run: |
          set -euo pipefail
          if [[ ! "$RECORD_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Custom Launch requires one exact detached-record commit" >&2
            exit 1
          fi
          if [[ "$RECORD_COMMIT_SHA" == "$GITHUB_SHA" ]]; then
            echo "The detached record must not be stored in its Website subject commit" >&2
            exit 1
          fi
          record_ref="refs/remotes/origin/command-center-release-records"
          record_path="release-records/custom-launch-v1/release-record.json"
          record_file="$RUNNER_TEMP/custom-launch-release-record.json"
          test ! -e "$record_file"
          umask 077
          git fetch --no-tags origin \
            "+refs/heads/command-center-release-records:$record_ref"
          git cat-file -e "$RECORD_COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$RECORD_COMMIT_SHA" "$record_ref"
          test "$(git show -s --format=%ae "$RECORD_COMMIT_SHA")" = \
            "309941960+0xprogrammable@users.noreply.github.com"
          record_commit_json="$RUNNER_TEMP/custom-launch-release-record-commit.json"
          test ! -e "$record_commit_json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $COMMAND_CENTER_GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$record_commit_json" \
            "https://api.github.com/repos/0xprogrammable/programmable/commits/$RECORD_COMMIT_SHA"
          RECORD_COMMIT_JSON="$record_commit_json" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const commit = JSON.parse(readFileSync(process.env.RECORD_COMMIT_JSON, "utf8"));
          if (
            commit.sha !== process.env.RECORD_COMMIT_SHA ||
            commit.author?.login !== "0xprogrammable" ||
            commit.committer?.login !== "0xprogrammable" ||
            commit.commit?.verification?.verified !== true
          ) {
            throw new Error("detached record commit lacks verified Programmable provenance");
          }
          NODE
          git show "$RECORD_COMMIT_SHA:$record_path" > "$record_file"
          RECORD_FILE="$record_file" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const record = JSON.parse(readFileSync(process.env.RECORD_FILE, "utf8"));
          const requiredState = process.env.REQUIRED_DEPLOYMENT_STATE;
          if (
            !new Set(["disabled", "enabled"]).has(requiredState) ||
            record.releaseIntent?.targetMode !== requiredState
          ) {
            throw new Error("detached record target mode disagrees with the explicit stage mode");
          }
          const expectedMigrations = [
            "ops/website-projection-target/migrations/0001_projection_records_v1.sql",
            "ops/website-projection-target/migrations/0002_custom_launch_wallet_profile_v2.sql",
            "ops/website-projection-target/migrations/0003_registry_custom_public_read_v1.sql",
          ];
          const inventory =
            record.productionDependencies?.websiteProjection?.migrationInventory;
          if (
            !Array.isArray(inventory)
            || inventory.length !== expectedMigrations.length
          ) {
            throw new Error("Website projection migration inventory is incomplete");
          }
          for (const [index, path] of expectedMigrations.entries()) {
            const migration = inventory[index];
            const fileSha256 = `sha256:${createHash("sha256")
              .update(readFileSync(path))
              .digest("hex")}`;
            if (
              migration?.ordinal !== index + 1
              || migration?.path !== path
              || migration?.fileSha256 !== fileSha256
            ) {
              throw new Error(
                "Website projection migration bytes differ from the detached record",
              );
            }
          }
          NODE
          attestation_summary_file="$RUNNER_TEMP/custom-launch-cross-repository-attestation.json"
          test ! -e "$attestation_summary_file"
          record_arguments=(
            --require "$RECORD_REQUIREMENT"
            --verify-cross-repository-attestation
            --cross-repository-attestation-summary "$attestation_summary_file"
            --expect-website-commit "$GITHUB_SHA"
            --expect-package-artifact-hash "$EXPECTED_PACKAGE_ARTIFACT_HASH"
            --expect-cross-repository-attestation-commit "$EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA"
            --expect-cross-repository-binding-document-sha256 "$EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256"
            --expect-session-authority-configuration-evidence-sha256 "$EXPECTED_SESSION_AUTHORITY_CONFIGURATION_EVIDENCE_SHA256"
            --expect-detached-record-sha256 "$EXPECTED_RECORD_SHA256"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$RECORD_REQUIREMENT" == "dark_staging" || "$RECORD_REQUIREMENT" == "staging" ]]; then
            record_arguments+=(
              --expect-rollback-deployment-id "$ROLLBACK_DEPLOYMENT_ID"
              --expect-rollback-deployment-url "$ROLLBACK_DEPLOYMENT_URL"
              --expect-rollback-website-commit "$ROLLBACK_WEBSITE_COMMIT_SHA"
            )
          else
            echo "Custom Launch record level must be dark_staging or staging" >&2
            exit 1
          fi
          node scripts/verify-custom-launch-release-record.mjs \
            "$record_file" "${record_arguments[@]}"

      - name: Preserve detached Custom Launch release record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/custom-launch-release-record.json
            ${{ runner.temp }}/custom-launch-cross-repository-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Record Custom Launch release gate
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
        run: |
          {
            echo "## Custom Launch release record"
            echo
            echo "- Record commit: \`$RECORD_COMMIT_SHA\`"
            echo "- Release subject: \`${{ steps.custom-launch-record.outputs.release_subject_sha256 }}\`"
            echo "- Detached record: \`${{ steps.custom-launch-record.outputs.detached_record_sha256 }}\`"
            echo "- Backend cross-repository attestation: \`${{ steps.custom-launch-record.outputs.cross_repository_attestation_commit_sha }}\`"
            echo "- Backend binding document: \`${{ steps.custom-launch-record.outputs.cross_repository_binding_document_sha256 }}\`"
            echo "- Review authority: \`${{ steps.custom-launch-record.outputs.review_authority_mode }}\`"
            echo "- Stage mode: \`${{ steps.custom-launch-policy.outputs.stage_mode }}\`"
            echo "- Record level: \`${{ steps.custom-launch-policy.outputs.release_record_requirement }}\`"
            echo "- Gate: verified for this immutable staging candidate only"
            echo
            echo "No promotion is authorized by this staging gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve read-model release policy
        id: read-model-policy
        env:
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
        run: >-
          npm run perf:read-model:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Build production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Stage production build without assigning domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz --meta githubCommitSha="$GITHUB_SHA" --env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" --env PROGRAMMABLE_RELEASE_COMMIT_SHA="$GITHUB_SHA" --token="$VERCEL_TOKEN")"
          case "$deployment_url" in
            https://*) ;;
            *)
              echo "Vercel did not return a deployment URL" >&2
              exit 1
              ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Resolve exact staged deployment
        id: staged-deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          npm run perf:read-model:staged-deployment --
          --target-url "$DEPLOYMENT_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Gate exact dark Custom Launch readiness
        id: custom-launch-dark-readiness
        if: steps.custom-launch-policy.outputs.stage_mode == 'dark'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          PROGRAMMABLE_GITHUB_SESSION_AUTHORITY_EXPECTED_CONFIGURATION_HASH: ${{ steps.custom-launch-record.outputs.session_authority_runtime_configuration_hash }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch dark target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--evidence-output=$RUNNER_TEMP/custom-launch-dark-readiness-evidence.json" \
            --require-disabled
          echo "evidence_path=$RUNNER_TEMP/custom-launch-dark-readiness-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted dark Custom Launch readiness evidence
        if: steps.custom-launch-policy.outputs.stage_mode == 'dark'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-dark-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-dark-readiness.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact enabled Custom Launch candidate
        id: custom-launch-enabled-canary
        if: steps.custom-launch-policy.outputs.stage_mode == 'enabled'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          PROGRAMMABLE_GITHUB_SESSION_AUTHORITY_EXPECTED_CONFIGURATION_HASH: ${{ steps.custom-launch-record.outputs.session_authority_runtime_configuration_hash }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch canary target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--evidence-output=$RUNNER_TEMP/custom-launch-enabled-canary-evidence.json" \
            --require-enabled \
            --authenticated-canary
          echo "evidence_path=$RUNNER_TEMP/custom-launch-enabled-canary-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted enabled Custom Launch candidate evidence
        if: steps.custom-launch-policy.outputs.stage_mode == 'enabled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-enabled-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-enabled-canary.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact staged QuickNode wake route
        if: steps.read-model-policy.outputs.wake_canary_required == 'true'
        env:
          PROGRAMMABLE_QUICKNODE_STREAM_SECRET: ${{ secrets.PROGRAMMABLE_QUICKNODE_STREAM_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
        run: >-
          npm run perf:read-model:wake-canary --
          --target-url "$STAGED_TARGET_URL"

      - name: Attest exact staged release policy
        id: release-attestation
        env:
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          POLICY_MODE: ${{ steps.read-model-policy.outputs.mode }}
        run: >-
          npm run perf:read-model:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --verified-sha "$GITHUB_SHA"
          --vercel-project-id "$VERCEL_PROJECT_ID"
          --staged-deployment-id "$STAGED_DEPLOYMENT_ID"
          --staged-target-url "$STAGED_TARGET_URL"
          --production-origin "https://programmable.market"
          --expected-mode "$POLICY_MODE"
          --attestation-output "$RUNNER_TEMP/staged-release-attestation.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve staged release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-release-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release-attestation.outputs.attestation_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Record staged release attestation
        run: |
          {
            echo "## Staged release attestation"
            echo
            echo "- SHA-256: \`${{ steps.release-attestation.outputs.attestation_sha256 }}\`"
            echo "- Runtime mode: \`${{ steps.read-model-policy.outputs.mode }}\`"
            echo "- Production target: https://programmable.market"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 30 "$DEPLOYMENT_URL/" > /dev/null

      - name: Smoke staged Alchemy Explore APIs
        if: steps.read-model-policy.outputs.mode == 'alchemy-only'
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.STAGED_TARGET_URL);
          if (
            origin.protocol !== "https:" ||
            !origin.hostname.endsWith(".vercel.app") ||
            origin.pathname !== "/" ||
            origin.search ||
            origin.hash
          ) {
            throw new Error("Alchemy smoke target is not an exact Vercel origin");
          }
          const automationBypassSecret =
            process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const automationBypassSecretLength = Buffer.byteLength(
            automationBypassSecret ?? "",
            "utf8",
          );
          if (
            typeof automationBypassSecret !== "string" ||
            automationBypassSecretLength < 32 ||
            automationBypassSecretLength > 512 ||
            /[\r\n]/.test(automationBypassSecret)
          ) {
            throw new Error("Alchemy smoke automation bypass is unavailable");
          }
          const alchemySmokeRequestHeaders = Object.freeze({
            Accept: "application/json",
            "x-vercel-protection-bypass": automationBypassSecret,
          });

          const requestJson = async (path) => {
            let lastError;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const response = await fetch(new URL(path, origin), {
                  redirect: "error",
                  headers: alchemySmokeRequestHeaders,
                  signal: AbortSignal.timeout(30_000),
                });
                const text = await response.text();
                if (!response.ok) {
                  throw new Error(`${path} returned ${response.status}`);
                }
                if (Buffer.byteLength(text, "utf8") > 2 * 1024 * 1024) {
                  throw new Error(`${path} returned an oversized response`);
                }
                const readSource = response.headers.get(
                  "x-programmable-read-source",
                );
                if (
                  !["blob", "blob+postgres"].includes(readSource ?? "") ||
                  response.headers.get("x-programmable-rpc-provider") !== "alchemy"
                ) {
                  throw new Error(`${path} did not prove the Alchemy RPC source`);
                }
                return JSON.parse(text);
              } catch (error) {
                lastError = error;
                if (attempt < 12) {
                  await new Promise((resolve) => setTimeout(resolve, 5_000));
                }
              }
            }
            throw lastError ?? new Error(`${path} failed`);
          };

          const explore = await requestJson(
            "/api/explore?limit=20&page=1&sort=market-cap",
          );
          if (
            explore.status !== "ready" ||
            !Array.isArray(explore.tokens) ||
            explore.tokens.length < 1 ||
            explore.tokens.length > 20
          ) {
            throw new Error("staged Alchemy Explore is not a populated bounded page");
          }
          const releaseToken = explore.tokens.find(
            (token) =>
              /^0x[0-9a-fA-F]{40}$/.test(token?.tokenAddress ?? ""),
          );
          if (!releaseToken) {
            throw new Error("staged Alchemy Explore has no token identity");
          }
          const newestPageSize = 100;
          const newest = await requestJson(
            `/api/explore?limit=${newestPageSize}&page=1&sort=newest`,
          );
          const newestTotal = Number(newest.total);
          const newestTotalPages = Number(newest.totalPages);
          if (
            newest.status !== "ready" ||
            !Array.isArray(newest.tokens) ||
            newest.tokens.length < 1 ||
            newest.page !== 1 ||
            newest.pageSize !== newestPageSize ||
            !Number.isSafeInteger(newestTotal) ||
            newestTotal < 1 ||
            newestTotal > 10_000 ||
            !Number.isSafeInteger(newestTotalPages) ||
            newestTotalPages < 1 ||
            newestTotalPages > 100 ||
            newestTotalPages !== Math.ceil(newestTotal / newestPageSize)
          ) {
            throw new Error("staged Alchemy newest page is not populated");
          }
          const newestTokens = [];
          const seenNewestIds = new Set();
          for (let pageNumber = 1; pageNumber <= newestTotalPages; pageNumber += 1) {
            const page = pageNumber === 1
              ? newest
              : await requestJson(
                  `/api/explore?limit=${newestPageSize}&page=${pageNumber}&sort=newest`,
                );
            if (
              page.status !== "ready" ||
              page.page !== pageNumber ||
              page.pageSize !== newestPageSize ||
              page.total !== newestTotal ||
              page.totalPages !== newestTotalPages ||
              !Array.isArray(page.tokens) ||
              page.tokens.length < 1
            ) {
              throw new Error("staged Alchemy newest pagination is not stable");
            }
            for (const entry of page.tokens) {
              if (typeof entry?.id !== "string" || seenNewestIds.has(entry.id)) {
                throw new Error("staged Alchemy newest pagination is not unique");
              }
              seenNewestIds.add(entry.id);
              newestTokens.push(entry);
            }
          }
          if (newestTokens.length !== newestTotal) {
            throw new Error("staged Alchemy newest pagination is incomplete");
          }
          const newestChainId = String(newest.snapshot?.chainId ?? "");
          if (!/^(?:0|[1-9][0-9]*)$/.test(newestChainId)) {
            throw new Error("staged Alchemy newest snapshot has no canonical chain");
          }
          const launchChainId = (entry) => {
            const value = entry.exploreKind === "token"
              ? String(entry.id).split(":", 1)[0]
              : entry.exploreKind === "custom-project"
                ? String(entry.chainId ?? "")
                : "";
            if (!/^(?:0|[1-9][0-9]*)$/.test(value)) {
              throw new Error("staged Alchemy newest entry has no canonical chain");
            }
            return value;
          };
          const launchOrder = (entry) => {
            const coordinates = entry.exploreKind === "token"
              ? [
                  entry.launchBlockNumber,
                  entry.launchTransactionIndex,
                  entry.launchLogIndex,
                ]
              : entry.exploreKind === "custom-project" &&
                  entry.launchCategoryProvenance?.category === "custom"
                ? [
                    entry.launchCategoryProvenance.blockNumber,
                    entry.launchCategoryProvenance.transactionIndex,
                    entry.launchCategoryProvenance.logIndex,
                  ]
                : null;
            if (coordinates === null || coordinates.length !== 3) {
              throw new Error(
                "staged Alchemy newest entry has no canonical launch order",
              );
            }
            return coordinates.map((value) => {
              const normalized = String(value ?? "");
              if (!/^(?:0|[1-9][0-9]*)$/.test(normalized)) {
                throw new Error(
                  "staged Alchemy newest entry has no canonical launch order",
                );
              }
              return BigInt(normalized);
            });
          };
          const launchTime = (entry) => {
            const value = Date.parse(entry.launchedAt ?? "");
            if (!Number.isFinite(value)) {
              throw new Error("staged Alchemy newest entry has no canonical time");
            }
            return value;
          };
          for (const entry of newestTokens) {
            if (launchChainId(entry) !== newestChainId) {
              throw new Error("staged Alchemy newest entry is on another chain");
            }
            launchOrder(entry);
            launchTime(entry);
          }
          for (let index = 1; index < newestTokens.length; index += 1) {
            const previous = newestTokens[index - 1];
            const current = newestTokens[index];
            const previousOrder = launchOrder(previous);
            const currentOrder = launchOrder(current);
            if (
              launchTime(current) > launchTime(previous) ||
              currentOrder.some(
                (value, offset) =>
                  value > previousOrder[offset] &&
                  currentOrder.slice(0, offset).every(
                    (prefix, prefixOffset) =>
                      prefix === previousOrder[prefixOffset],
                  ),
              )
            ) {
              throw new Error("staged Alchemy newest page is not ordered newest-first");
            }
          }
          const oldest = await requestJson(
            `/api/explore?limit=${newestPageSize}&page=1&sort=oldest`,
          );
          const expectedOldestIds = newestTokens
            .slice(-newestPageSize)
            .reverse()
            .map((entry) => entry.id);
          if (
            oldest.status !== "ready" ||
            oldest.total !== newestTotal ||
            oldest.totalPages !== newestTotalPages ||
            !Array.isArray(oldest.tokens) ||
            oldest.tokens.map((entry) => entry.id).join("\n") !==
              expectedOldestIds.join("\n")
          ) {
            throw new Error("staged Alchemy oldest page is not ordered oldest-first");
          }
          const incrementalLaunchAddress =
            "0x468505087c2dfec4779f2d6a5f8481f03e32e905";
          const incrementalDetail = await requestJson(
            `/api/explore/token?address=${encodeURIComponent(incrementalLaunchAddress)}`,
          );
          const incrementalLaunch = incrementalDetail.token;
          const incrementalLaunchBlock = BigInt(
            incrementalLaunch?.launchBlockNumber ?? "-1",
          );
          const durableBlock = BigInt(
            incrementalDetail.snapshot?.blockNumber ?? "-1",
          );
          const launchCursorBlock = BigInt(
            incrementalDetail.launchDiscoverySnapshot?.blockNumber ?? "-1",
          );
          if (
            incrementalDetail.status !== "ready" ||
            incrementalLaunch?.tokenAddress?.toLowerCase() !==
              incrementalLaunchAddress ||
            launchCursorBlock < incrementalLaunchBlock ||
            (
              incrementalLaunch.launchDiscoverySource !==
                "alchemy-launch-overlay" &&
              durableBlock < incrementalLaunchBlock
            )
          ) {
            throw new Error(
              "staged Alchemy Explore did not recover the incremental launch cursor",
            );
          }
          const tokenList = await requestJson("/api/indexers/v1/token-list");
          if (
            !Array.isArray(tokenList.tokens) ||
            !tokenList.tokens.some(
              (token) =>
                String(token?.address ?? token?.tokenAddress ?? "").toLowerCase() ===
                releaseToken.tokenAddress.toLowerCase(),
            )
          ) {
            throw new Error("staged Alchemy token list does not contain the Explore token");
          }
          const tokenDetail = await requestJson(
            `/api/explore/token?address=${encodeURIComponent(releaseToken.tokenAddress)}`,
          );
          if (
            tokenDetail.status !== "ready" ||
            tokenDetail.token?.tokenAddress?.toLowerCase() !==
              releaseToken.tokenAddress.toLowerCase()
          ) {
            throw new Error("staged Alchemy token lookup did not resolve the Explore token");
          }
          process.stdout.write(
            `${JSON.stringify({
              status: "verified-alchemy-only-staged-public-apis",
              tokenAddress: releaseToken.tokenAddress,
              incrementalLaunchAddress,
              launchCursorBlockNumber:
                incrementalDetail.launchDiscoverySnapshot.blockNumber,
            })}\n`,
          );
          NODE

      - name: Record Alchemy-only read path
        if: steps.read-model-policy.outputs.mode == 'alchemy-only'
        run: |
          {
            echo "## Read-model release policy"
            echo
            echo "Alchemy-only: Explore, token detail and token list use the verified durable registry with live Alchemy enrichment."
            echo "Every non-Alchemy public read path is disabled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture staged read-model evidence
        id: read-model-capture
        if: steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        env:
          PROGRAMMABLE_PERFORMANCE_PROBE_TOKEN: ${{ secrets.PROGRAMMABLE_PERFORMANCE_PROBE_TOKEN }}
          PROGRAMMABLE_SHADOW_PROBE_TOKEN: ${{ secrets.PROGRAMMABLE_SHADOW_PROBE_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROGRAMMABLE_READ_MODEL_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
        run: >-
          npm run perf:read-model:capture --
          --target-url "$PROGRAMMABLE_READ_MODEL_TARGET_URL"
          --deployment-id "$PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID"
          --output-directory "$RUNNER_TEMP/read-model-release-evidence"
          --kind production-canary
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve staged read-model evidence
        if: steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: read-model-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.read-model-capture.outputs.evidence_directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Gate indexed or shadow read path
        if: steps.read-model-policy.outputs.mode == 'indexed-or-shadow'
        env:
          PROGRAMMABLE_READ_MODEL_PERF_EVIDENCE_PATH: ${{ steps.read-model-capture.outputs.evidence_path }}
          PROGRAMMABLE_READ_MODEL_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_READ_MODEL_VERCEL_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_ALCHEMY_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT: ${{ vars.PROGRAMMABLE_QUICKNODE_MAINNET_RPC_ENDPOINT_COMMITMENT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run perf:read-model:gate

      - name: Reverify staged candidate binding
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
        run: |
          binding_output="$RUNNER_TEMP/final-staged-binding"
          test ! -e "$binding_output"
          npm run perf:read-model:staged-deployment -- \
            --target-url "$STAGED_TARGET_URL" \
            --github-output "$binding_output"
          grep -Fx "deployment_id=$EXPECTED_DEPLOYMENT_ID" "$binding_output"
          grep -Fx "target_url=$STAGED_TARGET_URL" "$binding_output"

      - name: Record staged candidate handoff
        env:
          DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          PREVIOUS_GIT_HEAD: ${{ steps.production-before.outputs.git_head }}
          POLICY_MODE: ${{ steps.read-model-policy.outputs.mode }}
        run: |
          {
            echo "## Staged production candidate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Deployment ID: \`$DEPLOYMENT_ID\`"
            echo "- Target: $STAGED_TARGET_URL"
            echo "- Previous production deployment: \`$PREVIOUS_DEPLOYMENT_ID\`"
            echo "- Previous production commit: \`$PREVIOUS_GIT_HEAD\`"
            echo "- Read model: ${{ steps.read-model-policy.outputs.mode }}"
            echo
            echo "Stage-only: no production promotion was attempted."
            if [ "$POLICY_MODE" = "indexed-or-shadow" ]; then
              echo "The manual operator must next capture and verify the DB-authored real-block SLA attestation, reverify this exact staged binding, promote this exact deployment ID, and run the post-promotion binding gate."
            elif [ "$POLICY_MODE" = "alchemy-only" ]; then
              echo "Before any separately authorized promotion, reverify this exact staged deployment ID and commit binding."
            else
              echo "Unrecognized staged release policy mode" >&2
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
